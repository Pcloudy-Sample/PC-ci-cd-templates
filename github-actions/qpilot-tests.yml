name: pCloudy QPilot - Run Collection

on:
  workflow_dispatch:
    inputs:
      cloud_host:
        description: "Host only (no https://). Example: device.pcloudy.com"
        required: true
        type: string
        default: device.pcloudy.com
      collection_id:
        description: "Collection ID"
        required: true
        type: string
      collection_config_id:
        description: "Collection Config ID"
        required: true
        type: string

jobs:
  run-qpilot-collection:
    name: Trigger QPilot Collection Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Host and Origin
        id: resolve
        run: |
          HOST="${{ github.event.inputs.cloud_host }}"

          case "$HOST" in
            "device.pcloudy.com")
              API_HOST="qpilot-backend.device.pcloudy.com"
              ORIGIN="https://qpilot.device.pcloudy.com" ;;
            "ind-west.pcloudy.com"|"us.pcloudy.com"|"sg.pcloudy.com"|"uae.pcloudy.com")
              API_HOST="qpilot-backend.${HOST}"
              ORIGIN="https://qpilot.device.pcloudy.com" ;;
            "qpilot-backend.device.pcloudy.com")
              API_HOST="qpilot-backend.device.pcloudy.com"
              ORIGIN="https://qpilot.device.pcloudy.com" ;;
            *)
              echo "Unknown cloud_host: $HOST"
              echo "Allowed hosts: device.pcloudy.com, ind-west.pcloudy.com, us.pcloudy.com, sg.pcloudy.com, uae.pcloudy.com, qpilot-backend.device.pcloudy.com"
              exit 1 ;;
          esac

          echo "input_host=$HOST" >> $GITHUB_OUTPUT
          echo "host=$API_HOST" >> $GITHUB_OUTPUT
          echo "origin=$ORIGIN" >> $GITHUB_OUTPUT

      - name: Trigger pCloudy QPilot Collection
        id: trigger
        run: |
          echo "Input Host:           ${{ steps.resolve.outputs.input_host }}"
          echo "QPilot Backend Host:  ${{ steps.resolve.outputs.host }}"
          echo "Origin:               ${{ steps.resolve.outputs.origin }}"
          echo "Collection ID:        ${{ github.event.inputs.collection_id }}"
          echo "Collection Config ID: ${{ github.event.inputs.collection_config_id }}"

          REQUEST_PAYLOAD="{\"collectionId\": \"${{ github.event.inputs.collection_id }}\", \"collectionConfigId\": \"${{ github.event.inputs.collection_config_id }}\"}"

          echo "Collection run request:"
          echo "POST https://${{ steps.resolve.outputs.host }}/api/v2/collection/run"
          echo "Headers: content-type=application/json, origin=${{ steps.resolve.outputs.origin }}, token=***"
          echo "Body: $REQUEST_PAYLOAD"

          HTTP_STATUS=$(curl --silent --output /tmp/response.json \
            --write-out "%{http_code}" \
            --request POST \
            --url "https://${{ steps.resolve.outputs.host }}/api/v2/collection/run" \
            --header "content-type: application/json" \
            --header "origin: ${{ steps.resolve.outputs.origin }}" \
            --header "token: ${{ secrets.PCLOUDY_TOKEN }}" \
            --data "$REQUEST_PAYLOAD")

          echo "HTTP Status: $HTTP_STATUS"
          echo "API Response:"
          cat /tmp/response.json | python3 -m json.tool || cat /tmp/response.json

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Request failed with HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "response=$(cat /tmp/response.json)" >> $GITHUB_OUTPUT

      - name: Show Run Result
        run: |
          echo "Collection run triggered successfully."
          echo "Response: ${{ steps.trigger.outputs.response }}"
